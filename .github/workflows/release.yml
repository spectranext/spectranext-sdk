name: Publish SDK release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (also supports retrying older releases)
        required: true
        type: string

permissions:
  contents: read

# Serialize publications; never interrupt a half-published release.
concurrency:
  group: sdk-release-publication
  cancel-in-progress: false

jobs:
  homebrew:
    name: Homebrew archive and tap
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 automation/.github/scripts/release.py metadata --tag "$RELEASE_TAG"
      - name: Check out released SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: sdk
          persist-credentials: false
      - name: Use Python matching the Homebrew formula
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Test release helpers
        run: python3 -m unittest discover -s automation/.github/scripts/tests -v
      - name: Build or reuse ARM64 archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SDK_VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
          ASSET_EXISTS: ${{ steps.release.outputs.asset_exists }}
          IMMUTABLE: ${{ steps.release.outputs.immutable }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p sdk/dist
          if [ "$ASSET_EXISTS" = true ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir sdk/dist
          else
            if [ "$IMMUTABLE" = true ]; then
              echo 'Cannot attach an asset to an immutable published release.' >&2
              exit 1
            fi
            make -C sdk homebrew-tarball SDK_VERSION="$SDK_VERSION" HOMEBREW_ARCH=arm64 PYTHON=python3
            python3 automation/.github/scripts/release.py checksum --archive "sdk/dist/$ASSET"
            gh release upload "$RELEASE_TAG" "sdk/dist/$ASSET" "sdk/dist/$ASSET.sha256" --repo "$GITHUB_REPOSITORY"
          fi
          python3 automation/.github/scripts/release.py checksum --archive "sdk/dist/$ASSET"
      - name: Create Homebrew repository token
        if: steps.release.outputs.promote == 'true'
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: spectranext
          repositories: homebrew-spectranext
          permission-contents: write
      - name: Commit Homebrew formula URL, version and checksum
        if: steps.release.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          SDK_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: python3 automation/.github/scripts/release.py tap --tag "$RELEASE_TAG" --archive "sdk/dist/$ASSET"

  docker-alpine:
    name: Docker Hub sdk-alpine
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 automation/.github/scripts/release.py metadata --tag "$RELEASE_TAG"
      - name: Check out released SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: sdk
          persist-credentials: false
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sdk
          file: sdk/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            spectranext/sdk-alpine:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.promote == 'true' && 'spectranext/sdk-alpine:latest' || '' }}
          cache-from: type=gha,scope=sdk-alpine
          cache-to: type=gha,mode=max,scope=sdk-alpine

  docker-ubuntu:
    name: Docker Hub sdk-ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 automation/.github/scripts/release.py metadata --tag "$RELEASE_TAG"
      - name: Check out released SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: sdk
          persist-credentials: false
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: sdk
          file: sdk/Dockerfile.ubuntu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            spectranext/sdk-ubuntu:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.promote == 'true' && 'spectranext/sdk-ubuntu:latest' || '' }}
          cache-from: type=gha,scope=sdk-ubuntu
          cache-to: type=gha,mode=max,scope=sdk-ubuntu
